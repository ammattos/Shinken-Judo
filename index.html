<style>
:root{--bg:#f2f2ee;--card:#fff;--ink:#17202b;--mut:#657080;--line:#dcdcd3;--acc:#c8231b;--on:#fff;--bad:#b8322a;--bt:#8b9099;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#19202a;--ink:#eceee9;--mut:#93a0ac;--line:#2a3441;--acc:#ff6a5c;--on:#0e1620;--bad:#e0675d}}
:root[data-theme="dark"]{--bg:#10151b;--card:#19202a;--ink:#eceee9;--mut:#93a0ac;--line:#2a3441;--acc:#ff6a5c;--on:#0e1620;--bad:#e0675d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
h1{font-size:28px;line-height:1.1;margin:6px 0 4px}
h2{font-size:19px;margin:24px 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:11px 14px;font-weight:600;width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.obi{height:34px;border-radius:6px;background:var(--line);position:relative;overflow:hidden;margin:12px 0 6px}
.obi i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--b1),var(--b2));transition:width .5s}
.obi b{position:absolute;right:0;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.08) 6px 7px)}
.big{font:700 40px/1 Georgia,serif}
.ck{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0}
.ck:last-child{border:0}
.bx{flex:none;width:22px;height:22px;border:2px solid var(--mut);border-radius:6px;margin-top:1px}
.on .bx{background:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--card)}
.on span:last-child{color:var(--mut)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:12px;padding:1px 7px;color:var(--mut);margin-left:6px;white-space:nowrap}
.rm{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.rm:last-child{border:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid var(--line)}
.me{font-weight:700}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:70px;margin:8px 0}
label{font-size:13px;color:var(--mut);display:block;margin:8px 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal .h{text-align:center;font-size:12px;color:var(--mut)}
.d{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:none;font-size:14px}
.d.T{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700}
.d.F{background:var(--bad);color:#fff;border-color:var(--bad)}
.d.R{border-style:dashed;color:var(--mut)}
.d.now{outline:2px solid var(--bt);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 22px Georgia,serif}.stat span{font-size:12px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;margin-top:8px}
.opt.ok{background:var(--acc);color:var(--on);border-color:var(--acc)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.t{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.t:last-child{border:0}
.chip{font-size:12px;padding:2px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}.chip.s2{background:var(--acc);color:var(--on);border-color:var(--acc)}.chip.s1{border-color:var(--bt);color:var(--bt)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:13px 4px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--bt)}
/* folha A4 */
#sheet{background:#fff;color:#1a1a1a;border:1px solid #d5d5cc;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:22px 20px;font-size:13px;line-height:1.45}
#sheet h1{font-size:22px;margin:0}#sheet h3{font:700 14px Georgia,serif;margin:16px 0 6px;border-bottom:1px solid #1a1a1a;padding-bottom:3px}
#sheet .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#sheet .g div{border:1px solid #ccc;padding:6px;text-align:center}
#sheet .g b{display:block;font:700 18px Georgia,serif}#sheet small{color:#555}
#sheet .wk{display:flex;align-items:flex-end;gap:5px;height:70px}#sheet .wk div{flex:1;text-align:center;font-size:10px;color:#555}#sheet .wk i{display:block;background:#1f3a5f;margin-bottom:2px;min-height:2px}
#sheet ul{margin:4px 0;padding-left:18px}
.sel{background:var(--acc);color:var(--on);border-color:var(--acc)}.q{font:700 22px/1.3 Georgia,serif;margin:6px 0 4px}.lk{background:none;border:0;padding:0;text-align:left;flex:1;font-size:16px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}button.chip{background:var(--card)}.ov{position:fixed;inset:0;background:rgba(10,15,20,.55);overflow:auto;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px}.fc{background:var(--card);border-radius:16px;padding:16px;max-width:560px;margin:0 auto}.stp{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.stp b{font:700 24px Georgia,serif;color:var(--bt);width:22px;flex:none}details summary{list-style:none}:root{--ok:#2f7d4f}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#5fb37e}}:root[data-theme="dark"]{--ok:#5fb37e}#hd{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:3px solid #c8231b;padding:8px 16px}#hd img{display:block;height:34px;width:auto}#hd span{margin-left:auto;font-size:12px;color:#555}.on .bx{background:var(--ok);border-color:var(--ok)}.chip.s2,.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.d.T{background:var(--ink);color:var(--card);border-color:var(--ink)}nav button.on{box-shadow:inset 0 3px 0 var(--acc)}.stp b{color:var(--acc)}@page{size:A4;margin:12mm}
@media print{body{background:#fff;padding:0}body *{visibility:hidden}#sheet,#sheet *{visibility:visible}#sheet{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none;padding:0}}
:root{--grid:#0000000b}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--grid:#ffffff0b}}:root[data-theme="dark"]{--grid:#ffffff0b}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 112px}
h1{font:italic 800 32px/1 'Barlow Condensed','Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;margin:6px 0 4px}
#sheet h1{font:700 22px Georgia,serif;text-transform:none;letter-spacing:0}
h2{font:800 19px/1.2 'Shippori Mincho B1','Iowan Old Style',Georgia,serif}
h2::before{content:'';display:inline-block;width:10px;height:10px;background:var(--acc);margin-right:8px}
.card{border:1.5px solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--line)}
.btn{border-radius:3px;font:italic 800 18px 'Barlow Condensed','Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px}
.big{font:italic 800 44px/1 'Barlow Condensed','Arial Narrow',Impact,sans-serif;text-transform:uppercase}
.hk{display:inline-flex;flex:none;align-items:center;justify-content:center;width:56px;height:56px;background:var(--acc);color:#fff;font:800 30px 'Shippori Mincho B1','Noto Serif JP',serif;border-radius:6px;transform:rotate(-4deg);box-shadow:inset 0 0 0 3px var(--acc),inset 0 0 0 4.5px #ffffffd0}
.nd{display:flex;align-items:center;gap:14px;text-align:left;width:90%;background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:12px;margin-bottom:14px;box-shadow:4px 4px 0 var(--line)}
.nd small{color:var(--mut)}.lk2{opacity:.55}.lk2 .hk{background:#8b9099;box-shadow:none}
.stars{color:var(--acc);letter-spacing:2px}
.dt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin:0 3px}.dt.on{background:var(--acc)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}.nums span{border:1.5px solid var(--ink);border-radius:4px;text-align:center;padding:6px 2px;font-size:14px}.nums b{display:block;font:italic 800 24px 'Barlow Condensed','Arial Narrow',sans-serif}

:root{--bg:#fbfaf7;--card:#fbfaf7;--ink:#121212;--mut:#7b7a75;--line:#e7e4dc;--acc:#c8231b;--on:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0f;--card:#0e0e0f;--ink:#ecebe6;--mut:#8c8b86;--line:#2b2b2c;--acc:#ff5a4d;--on:#0e0e0f}}
:root[data-theme="dark"]{--bg:#0e0e0f;--card:#0e0e0f;--ink:#ecebe6;--mut:#8c8b86;--line:#2b2b2c;--acc:#ff5a4d;--on:#0e0e0f}
body{background:var(--bg);background-image:none;font:16px/1.65 'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif;padding-bottom:96px}
main{max-width:520px;padding:26px 22px}
h1{font:600 30px/1.2 'Shippori Mincho B1','Iowan Old Style',Georgia,serif;text-transform:none;letter-spacing:0;margin:6px 0 10px}
.eb{font:600 11px/1.2 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin:0 0 12px}
h2{font:600 11px/1.2 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin:46px 0 14px}
h2::before{display:none}
.sub{color:var(--mut);font-size:14px;line-height:1.6}
.card{background:none;border:0;box-shadow:none;border-radius:0;padding:0;margin:0 0 30px}
details.card{border-bottom:1px solid var(--line);margin:0;padding:14px 0}summary small{color:var(--mut);margin-left:6px;font-size:12px}
.btn{background:var(--ink);color:var(--bg);border-radius:0;font:600 13px 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:16px 18px}
.ghost{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:6px 0}
.lnk{background:none;border:0;border-bottom:1px solid var(--ink);padding:2px 0;font-size:14px;color:var(--ink);cursor:pointer}.lnk:disabled{opacity:.3;border-color:transparent}
.big{font:600 42px/1.05 'Shippori Mincho B1',Georgia,serif;text-transform:none}.big small{font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.hero{margin:18px 0 8px}.hero svg{width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:2px 22px;margin:20px 0 12px;border-bottom:1px solid var(--line)}.chips button{background:none;border:0;border-bottom:1.5px solid transparent;padding:8px 0;color:var(--mut);text-align:left;font-size:14px}.chips button small{display:block;font-size:10.5px;opacity:.8}.chips .on{color:var(--ink);border-color:var(--acc)}
.ck{border-bottom:1px solid var(--line);padding:14px 0;gap:14px}.bx{width:20px;height:20px;border:1.2px solid var(--ink);border-radius:50%;margin-top:2px;position:relative}.on .bx{background:var(--ink);border-color:var(--ink);box-shadow:none}.on .bx::after{content:'';position:absolute;left:6px;top:3px;width:5px;height:9px;border:solid var(--bg);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.rm{padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}.rm.me{font-weight:600}
.rowc{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0}.rowc .kj{font:400 32px/1 'Shippori Mincho B1',serif;color:var(--acc);width:44px;text-align:center;flex:none}.rowc .tx{flex:1}.rowc .tx small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}.rowc .tx b{font:600 17px 'Shippori Mincho B1',serif}.rowc .stars{font-size:12px;color:var(--acc);text-align:right;max-width:92px}.lk2{opacity:.45}
.hk{background:var(--acc);color:#fff;border-radius:3px;transform:rotate(-3deg);width:52px;height:52px;box-shadow:none;outline:1.5px dotted #ffffffcc;outline-offset:-5px;font:600 28px 'Shippori Mincho B1',serif}
.scn{margin:6px 0 4px}.scn svg{display:block;width:100%;height:auto}
.q{font:600 22px/1.4 'Shippori Mincho B1',Georgia,serif;margin:6px 0 16px}
.opt{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px 2px;margin:0;text-align:left;width:100%}.opt.ok{background:none;border-color:var(--ok);color:var(--ok);font-weight:600}.opt.no{background:none;color:var(--acc);text-decoration:line-through;border-color:var(--acc)}
.stats{gap:0;margin-bottom:28px}.stat{background:none;border:0;border-left:1px solid var(--line);border-radius:0;text-align:left;padding:0 14px}.stat:first-child{border-left:0;padding-left:0}
.d{border:0;border-radius:50%;background:none}.d.T{background:var(--ink);color:var(--bg);border:0}.d.F{background:none;color:var(--acc);box-shadow:inset 0 0 0 1.4px var(--acc);border:0}.d.R{border:1px dashed var(--line);color:var(--mut)}.d.now{outline:0;box-shadow:inset 0 0 0 1.4px var(--acc)}
nav{background:var(--bg);border-top:1px solid var(--line)}nav button{padding:9px 2px 10px;font:600 10px 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}nav .kn{display:block;font:400 19px/1.2 'Shippori Mincho B1',serif;letter-spacing:0;text-transform:none;margin-bottom:2px}nav button.on{color:var(--ink);box-shadow:none}nav button.on .kn{color:var(--acc)}
#hd{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 22px}#hd img{height:26px;background:#fff;padding:2px 6px}#hd span{font:400 15px 'Shippori Mincho B1',serif;color:var(--ink)}
.obi{height:3px;background:var(--line);border-radius:0;margin:10px 0 4px}.obi i{background:var(--acc)}.obi b{display:none}
input,select,textarea{background:none;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:10px 0}label{font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase}
.fc{background:var(--bg);border:0;border-radius:0}.ov{background:rgba(10,10,10,.5)}.pn svg{border:0}.stx{margin:8px 0 22px}.eb+h1{margin-top:0}
button.chip{background:none;border:0;color:var(--mut);font-size:12px;letter-spacing:.1em;text-transform:uppercase}.chip.s2{background:none;color:var(--ok)}.chip.s1{color:var(--acc)}.t{padding:13px 0}

const G=[['1º Kyô',['De-ashi-barai','Hiza-guruma','Sasae-tsurikomi-ashi','Uki-goshi','Osoto-gari','O-goshi','Ouchi-gari','Seoi-nage']],['2º Kyô',['Kosoto-gari','Kouchi-gari','Koshi-guruma','Tsurikomi-goshi','Okuri-ashi-barai','Tai-otoshi','Harai-goshi','Uchi-mata']],['3º Kyô',['Kosoto-gake','Tsuri-goshi','Yoko-otoshi','Ashi-guruma','Hane-goshi','Harai-tsurikomi-ashi','Tomoe-nage','Kata-guruma']],['4º Kyô',['Sumi-gaeshi','Tani-otoshi','Hane-makikomi','Sukui-nage','Utsuri-goshi','O-guruma','Soto-makikomi','Uki-otoshi']],['5º Kyô',['Osoto-guruma','Uki-waza','Yoko-wakare','Yoko-guruma','Ushiro-goshi','Ura-nage','Sumi-otoshi','Yoko-gake']]];
const TABS=[['ini','Jornada'],['cal','Treinos'],['est','Estudo'],['sab','Saber'],['rel','Relatório']];
let tab='ini',view=new Date(),Q=null,conf=false;view.setDate(1);

const tgt=()=>B[S.lv]||null;
const reqs=()=>{const t=tgt();return t?[...t[5],...(S.lv>=8&&S.lv<=10?[FPJ[S.lv-8]]:[])]:[]};
const rdone=()=>reqs().filter((_,i)=>S.req[S.lv+'-'+i]).length;
const pct=()=>{const n=reqs().length;return n?Math.round(100*rdone()/n):100};
const cols=()=>{const t=tgt();const c=t?t[4]:['#17202b'];return[c[0],c[c.length-1]]};
const addM=(s,m)=>{const d=new Date(s+'T00:00');d.setMonth(d.getMonth()+m);return iso(d)};
const age=()=>{if(!S.birth)return null;const b=new Date(S.birth+'T00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
function theme(){const c=cols();document.documentElement.style.setProperty('--bt',c[1]==='#e4e4de'?'#8b9099':c[1])}
function stats(m){let T=0,F=0,tot=0;for(const k in S.days){if(S.days[k]==='T'){tot++;if(!m||k.startsWith(m))T++}if(S.days[k]==='F'&&(!m||k.startsWith(m)))F++}
  let st=0,d=new Date();for(let i=0;i<400;i++){const v=S.days[iso(d)];if(v==='T')st++;else if(v==='R'){}else if(!(i===0&&!v))break;d.setDate(d.getDate()-1)}
  return{T,F,tot,st,p:T+F?Math.round(100*T/(T+F)):0}}
function weeks(){const w=[],m=new Date();m.setDate(m.getDate()-((m.getDay()+6)%7));for(let k=7;k>=0;k--){let c=0;for(let d=0;d<7;d++){const x=new Date(m);x.setDate(m.getDate()-k*7+d);if(S.days[iso(x)]==='T')c++}w.push(c)}return w}
function elig(){const t=tgt();if(!t)return'';const a=age(),o=[];
  o.push(a===null?'Informe sua data de nascimento para checar a idade mínima ('+t[2]+' anos).':a>=t[2]?'Idade mínima ('+t[2]+' anos): atendida.':'Idade mínima: '+t[2]+' anos. Faltam '+(t[2]-a)+' ano(s).');
  if(S.since){const e=addM(S.since,t[3]);o.push('Carência recomendada de '+t[3]+' meses: a partir de '+br(e)+(iso(new Date())>=e?' (cumprida).':'.'))}else o.push('Informe desde quando você está nesta faixa para calcular a carência ('+t[3]+' meses).');
  if(a!==null&&a>16&&S.lv<=6)o.push('Acima de 16 anos a CBJ não exige a sequência nem a carência nas faixas básicas (regulamento CBJ 2021, art. 3º, §5º). Confirme com a FPJ.');
  return o.map(x=>'<p class="sub" style="margin:4px 0">'+x+'</p>').join('')}

function nav(){document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
function go(t){tab=t;if(t==='est')Q=null;conf=false;render();window.scrollTo(0,0)}

function ini(){const t=tgt(),c=cols(),n=reqs().length;
  const cur=S.lv?B[S.lv-1][0]+' ('+B[S.lv-1][1]+')':'Branca';
  let h=`<div class="row"><h1>Jornada do Judoca</h1><img src="${LOGO}" width="60" height="60" alt="Shinken Judô"></div><p class="sub">Faixa atual: ${cur}. Federação: São Paulo (FPJ).</p>`;
  if(!t)return h+`<div class="card"><b class="serif">Você chegou à faixa marrom.</b><p class="sub">O próximo passo é a faixa preta (Shodan). Esse módulo entra na próxima versão.</p><button class="ghost" onclick="back()">Voltar uma faixa</button></div>`;
  h+=`<div class="card"><div class="sub" style="margin:0">Próxima faixa</div><div class="big">${t[0]}</div><div class="sub" style="margin:2px 0 0">${t[1]} · idade mínima ${t[2]} anos · carência ${t[3]} meses</div>
  <div class="obi" style="--b1:${c[0]};--b2:${c[1]}"><i style="width:${pct()}%"></i><b></b></div><div class="row sub" style="margin:0"><span>${rdone()} de ${n} requisitos</span><span>${pct()}%</span></div></div>
  <div class="card"><b class="serif">Posso fazer o exame?</b>${elig()}
  <label>Data de nascimento</label><input type="date" value="${S.birth}" onchange="S.birth=this.value;save();render()">
  <label>Na faixa atual desde</label><input type="date" value="${S.since}" onchange="S.since=this.value;save();render()"></div>
  <h2>Requisitos</h2><div class="card" style="padding:4px 14px">`+reqs().map((r,i)=>{const f=i>=t[5].length,k=S.lv+'-'+i;return`<button class="ck ${S.req[k]?'on':''}" onclick="tg('${k}')"><span class="bx"></span><span>${r}${f?'<span class="tag">CBJ</span>':''}</span></button>`}).join('')+`</div>
  <p class="sub">O exame cobra também o conteúdo das faixas anteriores (CBJ 2021, art. 6º: modo cumulativo). ${S.lv<7?'O exame é feito no seu dojo, sob um professor faixa preta, e a FPJ homologa a faixa.':'Vocabulário, histórico e princípios podem ser sugeridos pela Comissão Estadual de Graduação da FPJ.'}</p>
  <button class="btn" onclick="adv()">${conf?'Confirmar: passei para a '+t[0]:'Concluí esta faixa'}</button>
  <h2>Caminho até a marrom</h2><div class="card" style="padding:4px 14px"><div class="rm ${S.lv===0?'me':''}"><span class="dot" style="background:#e4e4de"></span>Branca (iniciante)</div>`+B.map((b,i)=>`<div class="rm ${i===S.lv?'me':''}" style="${i<S.lv?'color:var(--mut)':''}"><span class="dot" style="background:linear-gradient(90deg,${b[4][0]},${b[4][b[4].length-1]})"></span><span style="flex:1">${b[0]}</span><span>${b[1]}</span></div>`).join('')+`</div>
  <p class="sub">Fonte: CBJ, Regulamento para Exame e Outorga de Faixas e Graus (2021). Confirme com a FPJ o edital do exame e se há versão mais recente.</p>`;
  return h}
function tg(k){S.req[k]=!S.req[k];save();const y=scrollY;render();scrollTo(0,y)}
function adv(){if(!conf){conf=true;return render()}conf=false;S.lv++;S.since=iso(new Date());save();render();scrollTo(0,0)}
function back(){S.lv=Math.max(0,S.lv-1);save();render()}

function cal(){const s=stats(iso(view).slice(0,7)),y=view.getFullYear(),mo=view.getMonth(),f=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),td=iso(new Date());
  let c=['D','S','T','Q','Q','S','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<span></span>'.repeat(f);
  for(let d=1;d<=n;d++){const k=iso(new Date(y,mo,d));c+=`<button class="d ${S.days[k]||''} ${k===td?'now':''}" onclick="mk('${k}')">${d}</button>`}
  return`<p class="eb">Keiko · 稽古 · treino</p><h1>Treinos</h1><p class="sub">Toque no dia: treinou, faltou, descanso.</p>
  <div class="stats"><div class="stat"><b>${s.T}</b><span>treinos no mês</span></div><div class="stat"><b>${s.p}%</b><span>presença</span></div><div class="stat"><b>${stats().st}</b><span>dias seguidos</span></div></div>
  <div class="card"><div class="row"><button class="ghost" onclick="mv(-1)" aria-label="Mês anterior">‹</button><b style="text-transform:capitalize">${view.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="ghost" onclick="mv(1)" aria-label="Próximo mês">›</button></div><div class="cal">${c}</div></div>
  <div class="card"><b class="serif">Diário de treino</b><textarea id="nt" placeholder="O que treinou? O que o sensei corrigiu?"></textarea><button class="btn" onclick="an()">Salvar anotação</button>`+[...S.notes].reverse().slice(0,6).map(n=>`<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:14px"><span class="sub">${n.d}</span><br>${esc(n.x)}</div>`).join('')+`</div>`}
function mk(k){const o={'':'T',T:'F',F:'R',R:''},n=o[S.days[k]||''];if(n)S.days[k]=n;else delete S.days[k];save();render()}
function mv(d){view=new Date(view.getFullYear(),view.getMonth()+d,1);render()}
function an(){const x=document.getElementById('nt').value.trim();if(!x)return;S.notes.push({d:br(iso(new Date())),x});save();render()}

function est(){
  let h='<h1>Estudo</h1>';
  const known=Object.keys(S.cards).length;
  if(!Q)h+=`<p class="sub">Vocabulário do exame (termos do regulamento da CBJ).</p><div class="card"><p style="margin-top:0">${known} de ${CARDS.length} termos acertados. ${S.rounds.length} rodadas feitas.</p><button class="btn" onclick="sq()">Rodada de 10 perguntas</button></div>`;
  else if(Q.i>=10)h+=`<div class="card"><div class="big">${Q.s}/10</div><p class="sub">Acertos nesta rodada.</p><button class="btn" onclick="sq()">Nova rodada</button><button class="ghost" style="width:100%;margin-top:8px" onclick="Q=null;render()">Voltar</button></div>`;
  else{const c=Q.l[Q.i];h+=`<p class="sub">Pergunta ${Q.i+1} de 10</p><div class="card"><div class="serif" style="font-size:24px;font-weight:700">${c[0]}</div><p class="sub">O que significa?</p>`+Q.o.map(o=>`<button class="opt ${Q.a!==null?(o===c[1]?'ok':o===Q.a?'no':''):''}" ${Q.a!==null?'disabled':''} onclick="an2(this.dataset.v)" data-v="${esc(o)}">${o}</button>`).join('')+(Q.a!==null?`<button class="btn" style="margin-top:12px" onclick="nq()">Próxima</button>`:'')+`</div>`}
  h+=`<h2>Gokyo: as 40 técnicas</h2><p class="sub">As faixas pedem os kyôs em ordem. Toque para marcar: não vi, estudando, dominei.</p>`;
  G.forEach(g=>{const d=g[1].filter(n=>S.tech[n]===2).length;h+=`<div class="card" style="padding:4px 14px"><div class="row" style="padding:8px 0"><b class="serif">${g[0]}</b><span class="sub" style="margin:0">${d}/8</span></div>`+g[1].map(n=>{const v=S.tech[n]||0;return`<button class="t" onclick="cy('${n}')"><span>${n}</span><span class="chip s${v}">${['Não vi','Estudando','Dominei'][v]}</span></button>`}).join('')+`</div>`});
  return h}
function sq(){Q={l:[...CARDS].sort(()=>Math.random()-.5).slice(0,10),i:0,s:0,a:null,o:[]};opts();render()}
function opts(){const c=Q.l[Q.i];Q.o=[c[1],...CARDS.filter(x=>x[1]!==c[1]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1])].sort(()=>Math.random()-.5)}
function an2(v){const c=Q.l[Q.i];Q.a=v;if(v===c[1]){Q.s++;S.cards[c[0]]=1;save()}render()}
function nq(){Q.i++;Q.a=null;if(Q.i>=10){S.rounds.push({d:iso(new Date()),s:Q.s});save()}else opts();render()}
function cy(n){S.tech[n]=((S.tech[n]||0)+1)%3;save();const y=scrollY;render();scrollTo(0,y)}

function rel(){const s=stats(),w=weeks(),mx=Math.max(3,...w),t=tgt(),dm=Object.values(S.tech).filter(v=>v===2).length,r=S.rounds.slice(-5),avg=r.length?Math.round(100*r.reduce((a,b)=>a+b.s/(b.t||10),0)/r.length):null;
  const cur=S.lv?B[S.lv-1][0]+' ('+B[S.lv-1][1]+')':'Branca',now=new Date().toLocaleString('pt-BR',{dateStyle:'long',timeStyle:'short'});
  let el='';if(t){const a=age(),e=S.since?addM(S.since,t[3]):null;el=`Idade mínima ${t[2]} anos: ${a===null?'não informada':a>=t[2]?'atendida':'ainda não'}. Carência recomendada de ${t[3]} meses: ${e?'a partir de '+br(e):'data de início não informada'}.`}
  return`<p class="eb">Kiroku · 記録 · registro</p><h1>Relatório</h1><p class="sub">Atualizado a cada acesso. Use Imprimir para salvar em PDF (A4).</p>
  <button class="btn" style="margin-bottom:12px" onclick="try{window.print()}catch(e){}">Imprimir ou salvar em PDF</button>
  <div id="sheet"><img src="${LOGO}" width="56" height="56" alt="Shinken Judô" style="float:right;margin-left:10px"><h1>Relatório de desempenho no judô</h1><small>Shinken Judô · Gerado em ${now} · Federação Paulista de Judô (SP)</small>
  <h3>Situação atual</h3><p style="margin:0">Faixa atual: <b>${cur}</b>.${t?` Próxima: <b>${t[0]} (${t[1]})</b>, com <b>${pct()}%</b> dos requisitos concluídos (${rdone()} de ${reqs().length}).`:' Próxima etapa: faixa preta.'}</p><p style="margin:4px 0 0">${el}</p>
  <h3>Frequência</h3><div class="g"><div><b>${s.tot}</b>treinos no total</div><div><b>${stats(iso(new Date()).slice(0,7)).p}%</b>presença no mês</div><div><b>${s.st}</b>dias seguidos</div></div>
  <p style="margin:8px 0 2px"><small>Treinos por semana (8 últimas semanas, a mais recente à direita)</small></p><div class="wk">${w.map(c=>`<div><i style="height:${c/mx*54}px"></i>${c}</div>`).join('')}</div>
  <h3>Domínio técnico e estudo</h3><ul><li>Gokyo: <b>${dm} de 40</b> técnicas dominadas (${G.map(g=>g[0].slice(0,2)+': '+g[1].filter(n=>S.tech[n]===2).length+'/8').join(' · ')}).</li><li>Vocabulário: <b>${Object.keys(S.cards).length} de ${CARDS.length}</b> termos acertados${avg===null?'':'; média recente de '+avg+'% nas rodadas'}.</li><li>Desempenho por tema: ${thTxt()}.</li></ul>
  ${t?`<h3>Requisitos pendentes para ${t[0]}</h3><ul>${reqs().filter((_,i)=>!S.req[S.lv+'-'+i]).slice(0,8).map(x=>'<li>'+x+'</li>').join('')||'<li>Nenhum pendente.</li>'}</ul>`:''}
  <h3>Anotações recentes</h3>${S.notes.slice(-3).reverse().map(n=>`<p style="margin:3px 0"><small>${n.d}</small> ${esc(n.x)}</p>`).join('')||'<small>Sem anotações.</small>'}
  <p style="margin-top:16px"><small>Base: CBJ, Regulamento para Exame e Outorga de Faixas e Graus (2021). Este relatório é de uso pessoal e não substitui o regulamento vigente nem o edital de exame da FPJ.</small></p></div>`}

S.th=S.th||{};S.mine=S.mine||[];
CARDS.push(['Ippon','ponto completo'],['Waza-ari','quase ippon'],['Osaekomi','imobilização iniciada'],['Toketa','imobilização desfeita'],['Dan','grau da faixa preta'],['Kyû','grau abaixo da faixa preta'],['Kata','forma (sequência ensaiada)'],['Gokyo','as 40 técnicas em cinco grupos'],['Tatami','piso de treino'],['Gari','ceifada'],['Goshi','quadril'],['Ashi','pé ou perna'],['Te','mão ou braço'],['Nage','projeção'],['Sutemi','sacrifício (queda do próprio corpo)'],['Gaeshi','reversão'],['Makikomi','envolvimento'],['Seiryoku zen\'yô','melhor uso da energia'],['Jita kyôei','prosperidade e benefício mútuo'],['Yûdansha','faixas pretas do 1º ao 5º dan'],['Kôdansha','alta graduação, a partir do 6º dan'],['Rei','saudação'],['Dojô','academia'],['Judoca','praticante de judô']);
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const T=Object.fromEntries(`De-ashi-barai|varredura do pé que avança|faça uke dar o passo, com o peso no pé da frente|apoie a sola do pé no tornozelo dele quando pisa|varra na direção do passo e gire o tronco|Varrer cedo, com uke ainda sustentando o peso.
Hiza-guruma|roda de joelho|puxe uke à frente e ao lado, tirando o peso de uma perna|apoie a sola do pé na frente do joelho dele, sem chutar|gire os braços em arco, como uma roda|Chutar o joelho em vez de bloquear.
Sasae-tsurikomi-ashi|apoio de pé com elevação|eleve a lapela e puxe uke à frente|bloqueie o pé dele com a sola do pé|gire sobre o pé de apoio por cima do bloqueio|Bloquear sem elevar e puxar antes.
Uki-goshi|quadril flutuante|puxe uke à frente, na ponta dos pés|envolva as costas dele e encaixe o quadril de lado|gire o tronco levando uke por cima do quadril|Deixar espaço entre os corpos.
Osoto-gari|grande ceifada externa|empurre uke para trás, sobre a perna de apoio|ponha seu pé ao lado do dele, peito junto|ceife a perna e empurre o tronco para trás|Ceifar só com a perna, sem levar o corpo.
O-goshi|grande quadril|puxe uke à frente e para cima|entre com os dois pés, envolva a cintura e baixe o quadril|estenda as pernas e gire levando uke por cima|Entrar de pernas retas, sem baixar.
Ouchi-gari|grande ceifada interna|empurre uke para trás, na diagonal|encaixe sua perna por dentro da dele|ceife a perna e empurre o tronco|Atacar sem empurrar o tronco.
Seoi-nage|projeção por cima do ombro|puxe uke à frente e para cima|gire, encaixe as costas no peito dele e dobre os joelhos|estenda as pernas e puxe o braço, projetando|Entrar de corpo duro, sem baixar.
Kosoto-gari|pequena ceifada externa|empurre uke para trás, para o calcanhar|ponha seu pé ao lado e encoste a lateral do pé no calcanhar|ceife e empurre o tronco para trás|Ceifar sem desequilibrar antes.
Kouchi-gari|pequena ceifada interna|leve uke para trás, sobre o calcanhar|encoste a sola do pé no calcanhar, por dentro|ceife e empurre o tronco na mesma linha|Ceifar sem empurrar o tronco.
Koshi-guruma|roda de quadril|puxe uke à frente e abrace o pescoço dele|encaixe o quadril, mantendo o braço no pescoço|gire o tronco como uma roda|Soltar o braço antes do giro.
Tsurikomi-goshi|quadril com elevação e puxada|eleve a lapela e puxe uke para a ponta dos pés|encaixe o quadril baixo, pés próximos|estenda as pernas e gire|Puxar sem elevar.
Okuri-ashi-barai|varredura de pés em sequência|aproveite o deslocamento lateral de uke|apoie a sola do pé nos pés dele quando se juntam|varra os dois pés na direção do passo|Varrer fora do tempo do passo.
Tai-otoshi|queda do corpo|puxe uke à frente e ao lado|estenda sua perna como bloqueio diante da dele|gire os braços e projete por cima da perna|Dobrar a perna de bloqueio.
Harai-goshi|varredura de quadril|puxe uke à frente|encaixe o quadril, perna de apoio firme|varra a perna dele com a sua e gire|Chutar sem encaixar o quadril.
Uchi-mata|coxa interna|puxe uke à frente, com peso numa perna|ponha o pé de apoio entre as pernas dele|eleve a coxa por dentro e gire|Elevar a perna sem trazer uke ao quadril.
Kosoto-gake|pequeno gancho externo|empurre uke para trás|enganche o calcanhar por fora com a sola do pé|empurre o tronco mantendo o gancho|Soltar o gancho antes da queda.
Tsuri-goshi|quadril de elevação|eleve uke pela faixa e puxe à frente|encaixe o quadril abaixo do dele|eleve e gire|Perder a pegada na faixa.
Yoko-otoshi|queda lateral|puxe uke para o lado|estenda a perna de bloqueio e sente de lado|projete lateralmente sobre sua perna|Sentar antes de desequilibrar.
Ashi-guruma|roda de perna|puxe uke à frente|bloqueie a perna dele com a sua estendida|gire os braços como uma roda|Bloquear só no tornozelo.
Hane-goshi|quadril com mola|puxe uke à frente|encaixe o quadril, apoio firme|lance a perna para trás e para cima junto com o giro|Chutar sem encaixar o quadril.
Harai-tsurikomi-ashi|varredura do pé com elevação|eleve e puxe a lapela|apoie a sola do pé no pé dele|varra rápido e gire|Varrer sem elevar.

const TQ=[['Qual é a ordem correta de uma projeção?','Kuzushi, tsukuri e kake.'],['O que é tsukuri?','Posicionar o corpo na melhor posição, mantendo o desequilíbrio.'],['Quantas direções tem o happo-no-kuzushi?','Oito.'],['Onde fica o centro de gravidade do corpo, segundo o manual?','No baixo-ventre.'],['Por que se encolhe o queixo no ukemi para trás?','Para a nuca não bater no chão.'],['Como se começa a ensinar o ukemi?','Individual, em postura baixa, parado e fácil.'],['Em que ordem se aprende o katame-waza?','Imobilizações, estrangulamentos e chaves.'],['De que pensamento vem o conceito de rei?','Do confucionismo.'],['Qual é a inclinação aproximada do ritsurei?','Cerca de 30 graus.'],['Em quais escolas Kano treinou jujutsu?','Tenjin Shin\'yô-ryû e Kitô-ryû.'],['Qual é o objetivo final da prática do judô, segundo Kano?','Aperfeiçoar-se e contribuir com a sociedade.'],['No exemplo de Kano, por que ceder à força maior economiza energia?','O oponente se desequilibra e perde força útil.'],['Quantas técnicas tem o Nage no Kata?','15, três de cada tipo.'],['Quais são as três formas de prática do judô?','Randori, kata e shiai.'],['Quem pode conduzir o exame das faixas coloridas?','Professor faixa preta maior de 18 anos, regular na CBJ.']];
const TH=[
['Do jujutsu ao judô: a história de Kano',[`Jigoro Kano era franzino e cresceu numa época de transição, do shogunato Tokugawa para a Restauração Meiji, quando o estudo valia mais que as artes marciais. Queria ficar mais forte, mas o pai se opôs. Só ao entrar na Universidade Imperial de Tóquio conseguiu treinar jujutsu, nas escolas Tenjin Shin'yô-ryû e Kitô-ryû.`,`Treinando, notou que o corpo e o temperamento se fortaleciam. Concluiu que aquilo tinha valor educativo, estudou outras escolas e dessa síntese nasceu o judô, com o Kodokan (1882). Manteve o ideograma Ju (suavidade) no nome porque, para ele, a técnica era só uma forma de aplicar um caminho (dô).`,`Kano criou o sistema de graduação (os primeiros 1º dan, em 1883) e, em 1895, o Gokyo, uma sequência pedagógica para ensinar as projeções, revisada depois. Por isso o judô se aprende em ordem, das técnicas básicas às avançadas.`,`Esse histórico explica o que a CBJ cobra: o exame mede também o conhecimento histórico e filosófico, o espírito do judô e a conduta, não só a técnica.`],'AJJF, As Instruções Básicas do Judô (2012); CBJ, Regulamento 2021'],
['Os três princípios: Seiryoku-zenyo, Jita-kyoei e Ju',[`Seiryoku-zenyo é usar a energia do corpo e da mente do modo mais eficiente para atingir um objetivo. Nasceu do estudo das técnicas, mas Kano o defendia como princípio universal, aplicável ao estudo, ao trabalho e à convivência.`,`Jita-kyoei vem da expressão "sojo-sojô, jita-kyoei": ajuda e concessão mútuas, prosperidade compartilhada. Na prática é concreto: ninguém treina sozinho. O parceiro é quem permite melhorar, por isso se agradece e se respeita.`,`Os dois funcionam juntos. O primeiro responde "como usar bem a energia"; o segundo, "para quê": para um bem que contribua com a sociedade. A prática passa por três fases: aprimorar o corpo, cultivar o espírito e aplicar o aprendizado na vida social.`,`Ju (suavidade) é a expressão física do primeiro princípio. No exemplo que Kano deu em 1932, quem tem 7 unidades de força não deve resistir a quem tem 10. Se cede, recuando sem perder o equilíbrio, o oponente se inclina e sua força útil cai para algo como 3 unidades, enquanto você mantém as 7. Ceder não é fraqueza: é economia de energia.`],'AJJF (2012); Manual de Formação 1º Dan, Judokai'],
['Rei: o sentido da etiqueta',[`O conceito de rei vem do pensamento confuciano, que lista cinco virtudes: humanidade (jin), justiça, ritual (rei), sabedoria e integridade. O rei é o jin posto em prática: a forma de tratar o outro com consideração.`,`No judô ninguém fica mais forte sem o parceiro. Por isso a saudação não é formalidade: agradecer só na aparência seria desrespeito. É aqui que o reiho (a etiqueta) encontra o jita-kyoei.`,`Na prática: no ritsurei (em pé) a inclinação é de cerca de 30 graus. No zarei (sentado) as mãos ficam sobre as coxas e não se levantam as nádegas ao inclinar.`],'AJJF (2012)'],
['Ukemi: aprender a cair é o começo',[`Antes de derrubar, aprende-se a ser derrubado. O ukemi é a base para treinar as projeções com segurança e prazer: quem sabe cair não precisa resistir à queda por medo.`,`A razão é fisiológica. Ao cair para trás, o reflexo é manter a cabeça erguida, e a nuca pode bater no chão. O ukemi ensina o contrário: encolher o queixo (olhar o nó da faixa), contrair o abdome e bater no tatami com braços e pernas para dissipar o impacto.`,`O ensino segue uma progressão: do exercício individual para o com parceiro, da postura baixa para a alta, do parado para o em movimento, do fácil para o complexo, do parcial para o total. O critério para avançar é o estado do corpo, não a idade.`],'AJJF (2012)'],
['Kuzushi, tsukuri e kake: a mecânica da projeção',[`Uma projeção tem três fases, sempre nesta ordem: kuzushi (desequilíbrio), tsukuri (posicionamento) e kake (execução). Tentar o kake sem um tsukuri correto é perda de energia.`,`O centro de gravidade fica no baixo-ventre. Quando a vertical que sai dele cai fora da base de apoio, a pessoa está desequilibrada. No happo-no-kuzushi são oito direções: frente, trás, direita, esquerda e as quatro diagonais.`,`O tsukuri é pôr o seu corpo na melhor posição em relação ao dele, sem parar de desequilibrá-lo. Mesmo num golpe "de quadril", o corpo todo trabalha como uma unidade; a parte citada no nome só orienta a projeção.`,`Dicas do manual: corpo relaxado, joelhos flexionados sem dobrar a cintura e, na dúvida, movimento rápido e decidido. Tentativas receosas gastam energia à toa. As três fases ficam claras no Nage no Kata.`],'Manual de Formação 1º Dan, Judokai'],
['Como as técnicas se organizam',[`Nage-waza (projeções) divide-se em tachi-waza (em pé: te-waza, koshi-waza e ashi-waza) e sutemi-waza (sacrifício: ma-sutemi, na linha do corpo, e yoko-sutemi, laterais). Katame-waza (controle) tem osaekomi (imobilizações), shime (estrangulamentos) e kansetsu (chaves). Atemi-waza são os golpes em pontos vitais.`,`Projeção e controle andam juntos: o controle é a continuação natural da projeção e dá força a ela. A ordem recomendada para aprender é imobilizações, estrangulamentos e só então chaves, e as imobilizações devem virar reação natural antes de avançar.`,`O Gokyo organiza as 40 projeções em 5 grupos de 8, e a CBJ exige um grupo a mais a cada etapa: o 1º Kyô desde a faixa branca/cinza, o 2º na laranja, o 3º na verde, o 4º na roxa e o 5º na marrom.`],'Manual 1º Dan, Judokai; CBJ, Regulamento 2021, art. 6º'],
['Randori, kata e shiai: três formas de prática',[`A CBJ cita três formas fundamentais de prática: randori (treino livre), kata (forma) e shiai (competição). Completam-se: o kata guarda a técnica ideal e os princípios, o randori testa e ajusta, o shiai mede sob pressão.`,`Katas das faixas pretas (FPJ 2025): Nage no Kata (1º dan; 15 projeções, 3 de cada tipo), Katame no Kata (2º dan; 5 imobilizações, 5 estrangulamentos e 5 chaves), Ju no Kata (3º dan; 15 movimentos em 3 séries de 5), Kime no Kata (4º dan; 20 técnicas, entre idori, ajoelhado, e tachiai, em pé) e Kodokan Goshin Jutsu (5º dan; 21 técnicas de defesa pessoal, desarmado e armado).`,`Nas faixas coloridas o Nage no Kata entra por partes: te-waza na verde, koshi-waza na roxa e ashi-waza na marrom.`],'CBJ, Regulamento 2021; FPJ, Regulamento Graduação 1º a 5º Dan 2025'],
['Faixas e graduações: como o sistema funciona',[`Há duas famílias: kyû (graus abaixo da preta, do 11º ao 1º) e dan (faixa preta). Os kyûs dividem-se em básicos (da branca à amarela/laranja) e intermediários (laranja, verde, roxa e marrom). O 1º ao 5º dan é yûdansha; o 6º e o 7º usam vermelha e branca (kôdansha), o 8º também, e o 9º e o 10º, vermelha. Kôdansha é título para quem se dedicou também ao ensino, ao estudo e à pesquisa.`,`Quem outorga: as faixas coloridas (dangai) são homologadas pela federação estadual, a partir de exames nas entidades filiadas, sob um professor faixa preta maior de 18 anos e regular na CBJ. A faixa preta do 1º ao 5º dan é homologada pela CBJ, depois do exame da comissão estadual.`,`Condições para qualquer exame: idoneidade moral (bom relacionamento e respeito aos princípios éticos), conhecimento teórico e prático do conteúdo e cumprimento dos critérios do regulamento. O programa é cumulativo e a lista não é exaustiva: espera-se conhecimento cada vez mais profundo.`,`Kano valorizava a conduta moral, o intelecto e a eficiência da técnica em combate, não só as vitórias. Entre os 10 primeiros a chegar ao 10º dan, a média foi de 58 anos de prática.`],'CBJ, Regulamento 2021']];

const ORI={sweep:['As varreduras (ashi-waza) pertencem ao núcleo do Gokyo, o conjunto que Kano sistematizou em 1895. Ensinam a perceber o instante em que o peso muda de um pé para o outro: quem sente esse instante precisa de pouca força.','O tempo é tudo. Ataque quando o pé de uke está pousando, nunca antes. Varra na direção do passo dele, mantenha o tronco dele em movimento com as mãos e complete o giro. Se ele recuperar o equilíbrio, encadeie com uma ceifada ou um quadril.'],
reap:['As ceifadas (ashi-waza) estão entre as projeções mais básicas do Gokyo. Treinam o desequilíbrio para trás, que é a base de toda a mecânica de kuzushi.','Primeiro desequilibre para trás, na diagonal; só depois ceife. A perna completa o que o tronco já começou: empurre o peito de uke na mesma linha da ceifada.'],
hip:['Os quadris (koshi-waza) estão no Gokyo, o conjunto que Kano montou estudando várias escolas de jujutsu. Colocam o centro de gravidade de tori abaixo do de uke.','Quadril baixo, pés próximos e pegada firme. Primeiro puxe uke para cima e para a frente; depois encaixe o quadril e estenda as pernas. A força vem das pernas, não dos braços.'],
shoulder:['As projeções de braço e ombro (te-waza) usam as mãos e o giro do tronco para conduzir uke. Foram reunidas por Kano no Gokyo como a contrapartida técnica dos quadris.','Mantenha o puxar com as duas mãos até o fim: o ombro é só o ponto de apoio. Desça o corpo antes de girar, para que uke passe por cima do seu eixo.'],
leg:['As projeções com perna e giro, como o uchi-mata, combinam o bloqueio ou a elevação da perna com o giro do tronco. Entram no Gokyo nos grupos intermediários.','Traga uke para o seu quadril antes de usar a perna: ela acompanha, quem projeta é o encaixe do corpo. Combine com ceifadas curtas: ele reage a uma e é projetado pela outra.'],
ma:['Os sacrifícios de costas (ma-sutemi) são projeções em que tori cai para trás junto com uke. Sutemi quer dizer «sacrificar o próprio corpo».','Só se sacrifica a posição depois de desequilibrar: se uke está firme, sentar é ficar embaixo dele. Puxe forte, entre baixo, use o pé como alavanca e termine em posição de controle no solo.'],
yoko:['Os sacrifícios laterais (yoko-sutemi) projetam uke pelo lado enquanto tori cai de lado. Formam o grupo mais variado de sutemi do Gokyo.','Escolha o momento em que uke avança ou recua, caia perto dele mantendo as pegadas e use o giro dos braços para levá-lo por cima. Já pense na transição para o solo.']};

{k:'礼',t:'Primeiros passos',c:[{s:'torii',t:'Antes de entrar',x:`O judô começa por um gesto, antes de qualquer golpe: a saudação. <b>Ritsu rei</b> é a saudação em pé; <b>zarei</b>, a saudação ajoelhado. Quem ensina é o <b>sensei</b>. Na faixa branca/cinza (11º kyû) é só isso que se cobra, e já resume a essência: o judô começa pelo respeito.`},{t:'O sentido do rei',x:TH[2][1][0]+'<br><br>'+TH[2][1][1]},{t:'Como ler as palavras',x:`A CBJ procura seguir a grafia próxima do japonês original. Por isso «gi» lê-se «gui», o «s» de Osaekomi soa duplo («ossaekomi») e «chi» lê-se «ti».`}],qa:()=>[...VQ('Sensei','Rei','Ritsurei','Zarei'),...Tq(7,8)]},
{k:'数',t:'Contar e vestir',c:[{t:'Contar até dez',x:`<div class="nums">${NUMS.map(n=>`<span><b>${n[1]}</b>${n[0]}</span>`).join('')}</div>Contar em japonês é exigência da faixa cinza (10º kyû).`},{s:'dojo',t:'Tatami e judogi',x:`O <b>tatami</b> é o piso de treino e de competição. O <b>judogi</b> é o uniforme. Os dois entram no vocabulário da faixa cinza, junto com os números.`},{p:1,t:'Jigoro Kano, o criador',cap:'Jigoro Kano (1860–1938). Foto histórica de arquivo.',x:TH[0][1][0]}],qa:()=>[...NUMS.map(n=>['Como se diz «'+n[1]+'» em japonês?',n[0],'jp']),...NUMS.map(n=>['Quanto é «'+n[0]+'»?',String(n[1]),'n']),...VQ('Judogi','Tatami'),...Hq(0)]},
{k:'声',t:'A voz do sensei',c:[{t:'Os comandos',x:`<b>Hajime</b>: começar.<br><b>Mate</b>: parar.<br><b>Soremade</b>: terminou.<br><b>Sonomama</b>: não se mova.<br><b>Kiotsuke</b>: atenção, posição de sentido.`},{t:'Kumikata',x:`<b>Kumikata</b> é o modo de pegar no judogui. Toda projeção começa por uma pegada: ela decide a direção em que se puxa e se empurra.`},{s:'dojo',t:'O Kodokan',x:`O <b>Kodokan</b> foi a primeira escola de judô, fundada por Kano. Seu nome (講道館) pode ser lido como «lugar onde se ensina o caminho».`}],qa:()=>[...VQ('Hajime','Mate','Soremade','Sonomama','Kiotsuke','Kumikata'),['Qual foi a primeira escola de judô?','O Kodokan.','h']]},
{k:'源',t:'Do jujutsu ao judô',c:[{t:'O uniforme em detalhe',x:`<b>Uwagui</b> é o casaco, <b>shitabaki</b> a calça, <b>obi</b> a faixa e <b>zoori</b> o chinelo. Amarrar a faixa corretamente é cobrado no 8º kyû.`},{s:'pagoda',t:'Kodokan, 1882',x:TH[0][1][1]+`<br><br>O Kodokan foi fundado em maio de 1882. O judô nasceu do jujutsu, a arte da suavidade, e por isso o nome guarda o ideograma <b>Ju</b>.`},{t:'Quem teme perder',x:`Princípio desta faixa: <i>«quem teme perder já está vencido»</i>. O medo de perder trava o corpo e a decisão; quem treina sem medo erra, aprende e evolui.`}],qa:()=>[...VQ('Uwagui','Shitabaki','Obi','Zoori'),...Hq(1,2),...Iq(4)]},
{k:'帯',t:'A ordem das faixas',c:[{t:'Kyû, dan e as cores',x:`Kyû básicas: ${B.slice(0,7).map(b=>b[0]).join(', ')}.<br>Intermediárias: ${B.slice(7,11).map(b=>b[0]).join(', ')}.<br>Depois vêm os dans: preta (1º ao 5º), vermelha e branca (6º ao 8º) e vermelha (9º e 10º).`},{t:'Treinar, treinar livre, competir',x:`<b>Uchikomi</b> é o treino de entrada das técnicas; <b>randori</b>, o treino livre; <b>shiai</b>, a competição. O local é o <b>dojô</b> (academia); a área de competição é o <b>shiaijô</b>.`},{s:'fuji',t:'1860: nasce Jigoro Kano',x:`Kano nasceu em 28 de outubro de 1860, na província de Hyogo, no Japão. ${TH[0][1][0]}`},{t:'Conhecer-se',x:`<i>«Conhecer-se é dominar-se, dominar-se é triunfar.»</i> Antes de vencer o outro, é preciso entender os próprios limites. As posturas também entram aqui: <b>shizen hontai</b> (natural) e <b>jigo hontai</b> (defensiva), à direita (migi) ou à esquerda (hidari).`}],qa:()=>[...VQ('Uchikomi','Randori','Shiai','Dojo','Shiaijo','Yûdansha','Kôdansha'),...Hq(3),...Iq(5)]},
{k:'取',t:'Tori e uke',c:[{t:'Os dois lados do golpe',x:`<b>Tori</b> é quem aplica a técnica; <b>uke</b>, quem a recebe. Os papéis se alternam o tempo todo: aprender a ser uke é metade do judô.`},{t:'Deslocar-se',x:`<b>Ayumi-ashi</b>: passadas naturais em todas as direções. <b>Tsugi-ashi</b>: passadas sucessivas. É assim que se anda sobre o tatami sem perder a base.`},{s:'ship',t:'1938: a morte de Kano',x:`Kano morreu em 4 de maio de 1938, a bordo de um navio que o levava de volta ao Japão, vindo do Cairo, onde participou da Assembleia Geral do Comitê Olímpico Internacional.`},{t:'Para se aperfeiçoar',x:`<i>«O judoca não se aperfeiçoa para lutar, luta para se aperfeiçoar.»</i> A luta é o instrumento; o objetivo é o desenvolvimento de quem treina.`}],qa:()=>[...VQ('Tori','Uke'),['O que é Ayumi-ashi?','Passadas naturais em todas as direções.','p'],['O que é Tsugi-ashi?','Passadas sucessivas.','p'],...Hq(4),...Iq(6)]},
{k:'柔',t:'O sentido do judô',c:[{t:'Ju e Dô',x:`<b>Ju</b> (柔) é suavidade: ceder, não resistir. <b>Dô</b> (道) é caminho, meio, doutrina. Judô é o caminho da suavidade.`},{t:'Seiryoku-zenyo',x:TH[1][1][0]},{t:'Jita-kyoei',x:TH[1][1][1]+'<br><br>'+TH[1][1][2]},{s:'wave',t:'1954: o judô brasileiro',x:`O 1º Campeonato Brasileiro de Judô foi realizado em 1954. Também nesta faixa se aprende o <b>tai sabaki</b>, a esquiva com giro do corpo.`}],qa:()=>[...Iq(0,1,2,3),...Hq(9),...VQ('Taisabaki')]},
{k:'崩',t:'Kuzushi, tsukuri e kake',c:[...thc(4),{s:'sun',t:'O judô nas Olimpíadas',x:`O judô esteve nos Jogos de Tóquio, em 1964, em caráter não oficial. Entrou oficialmente nos Jogos Olímpicos em Munique, em 1972.`},{t:'A perfeição',x:`<i>«Somente se aproxima da perfeição quem a procura com constância, sabedoria e, sobretudo, humildade.»</i>`}],qa:()=>[...Tq(0,1,2,3),...Hq(8),...Iq(9),...VQ('Kuzushi','Tsukuri','Kake')]},
{k:'型',t:'Randori, kata e shiai',c:[thc(6)[0],{s:'wave',t:'Os Mundiais',x:`O 1º Campeonato Mundial foi no Japão, em 1956. O Brasil sediou Mundiais no Rio de Janeiro em 1965, 2007 e 2013.`},{t:'Nage no Kata: te-waza',x:`O primeiro grupo do Nage no Kata: <b>Uki-otoshi</b>, <b>Seoi-nage</b> e <b>Kata-guruma</b>. O kata guarda a técnica em sua forma ideal.`},{t:'A vitória que dura',x:`<i>«A única vitória que perdura é a que se conquista sobre a própria ignorância.»</i>`}],qa:()=>[...Tq(13),...Hq(10,11),...Iq(7),['Quais técnicas formam o grupo te-waza do Nage no Kata?','Uki-otoshi, Seoi-nage e Kata-guruma.','n']]},
{k:'分',t:'Classificar para compreender',c:[thc(5)[0],thc(5)[1],{t:'Nage no Kata: koshi-waza',x:`O segundo grupo do Nage no Kata: <b>Uki-goshi</b>, <b>Harai-goshi</b> e <b>Tsurikomi-goshi</b>.`},{t:'Humildade',x:`<i>«Nunca te orgulhes de haver vencido um adversário: o que venceste hoje poderá vencer-te amanhã.»</i>`}],qa:()=>[...VQ('Nage waza','Osaekomi waza','Shime waza','Kansetsu waza','Katame waza','Sutemi'),...Tq(6),...Iq(8)]},
{k:'師',t:'Arbitrar e ensinar',c:[{t:'Noções de arbitragem',x:`Para a marrom, a CBJ pede noções básicas de arbitragem: voz de comando, gestos e avaliação, e atuação como oficial de mesa em competições.`},{t:'Kôdansha',x:`<b>Kôdansha</b> é um título de alta graduação criado pelo Instituto Kodokan, para quem se dedicou ao aprendizado, à prática contínua, à eficiência técnica e também ao ensino, ao estudo e à pesquisa do judô.`},{t:'Nage no Kata: ashi-waza',x:`O terceiro grupo do Nage no Kata: <b>Okuri-ashi-harai</b>, <b>Sasae-tsurikomi-ashi</b> e <b>Uchi-mata</b>. A Comissão Estadual de Graduação sugere vocabulário, histórico e princípios desta faixa.`}],qa:()=>[...VQ('Kôdansha'),['O que a CBJ pede de arbitragem na faixa marrom?','Voz de comando, gestos e avaliação.','a'],['Quais técnicas formam o grupo ashi-waza do Nage no Kata?','Okuri-ashi-harai, Sasae-tsurikomi-ashi e Uchi-mata.','n']]},
{k:'初',t:'A raiz profunda',c:[{p:1,t:'Kano e o Japão que mudava',cap:'Jigoro Kano (1860–1938).',x:TH[0][1][0]+'<br><br>'+TH[0][1][1]},{s:'pagoda',t:'Sistema, Gokyo e educação',x:TH[0][1][2]+'<br><br>'+TH[0][1][3]},{t:'Shu · Ha · Ri',x:`Tradição das artes japonesas que descreve o aprendizado em três estágios: <b>shu</b> (守), obedecer e copiar o mestre; <b>ha</b> (破), romper e adaptar; <b>ri</b> (離), afastar-se e criar o próprio caminho. A faixa preta é o fim do primeiro estágio, não do aprendizado.`},{t:'Ética e conduta',x:`Para qualquer exame, a CBJ exige idoneidade moral: bom relacionamento e respeito aos princípios éticos do judô. O exame teórico de 1º dan (FPJ 2025) tem 20 questões e aprovação com 50%.`},{t:'Nage no Kata completo',x:`15 projeções em 5 grupos:<br><b>Te-waza</b>: uki-otoshi, seoi-nage, kata-guruma.<br><b>Koshi-waza</b>: uki-goshi, harai-goshi, tsurikomi-goshi.<br><b>Ashi-waza</b>: okuri-ashi-harai, sasae-tsurikomi-ashi, uchi-mata.<br><b>Ma-sutemi</b>: tomoe-nage, ura-nage, sumi-gaeshi.<br><b>Yoko-sutemi</b>: yoko-gake, yoko-guruma, uki-waza.`}],qa:()=>[...Tq(9,10,12),...Hq(5,7),['Quantas questões tem a prova teórica de 1º dan na FPJ (2025)?','20.','x'],['O que significa «shu», no shu-ha-ri?','Obedecer e copiar o mestre.','x']]},
{k:'固',t:'Katame no Kata',c:[{t:'Quinze técnicas de solo',x:`<b>Osaekomi</b>: kesa-gatame, kata-gatame, kami-shiho-gatame, yoko-shiho-gatame, kuzure-kami-shiho-gatame.<br><b>Shime</b>: kata-juji-jime, hadaka-jime, okuri-eri-jime, kata-ha-jime, gyaku-juji-jime.<br><b>Kansetsu</b>: ude-garami, ude-hishigi-juji-gatame, ude-hishigi-ude-gatame, ude-hishigi-hiza-gatame, ashi-garami.`},{t:'No exame de 2º dan',x:`Katame no Kata completo, como tori, mais uma série sorteada do Nage no Kata. Teoria com 60% de aprovação, inclusive arbitragem, e média prática mínima 6. O uke deve ter, no mínimo, faixa marrom.`}],qa:()=>[['Qual kata é o foco do 2º dan?','Katame no Kata.','k'],['Quantas técnicas tem o Katame no Kata?','15, cinco de cada tipo.','x'],['Qual a aprovação mínima na teoria do 2º dan (FPJ 2025)?','60%.','x']]},

{k:'極',t:'Kime no Kata',c:[{t:'Vinte técnicas de defesa',x:`<b>Idori</b> (ajoelhado, 8): ryote-dori, tsukkake, suri-age, yoko-uchi, ushiro-dori, tsukkomi, kirikomi, yoko-tsuki.<br><b>Tachiai</b> (em pé, 12): ryote-dori, sode-tori, tsukkake, tsukiage, suri-age, yoko-uchi, keage, ushiro-dori, tsukkomi, kirikomi, nuki-kake, kirioroshi.`}],qa:()=>[['Qual kata é o foco do 4º dan?','Kime no Kata.','k'],['Quantas técnicas tem o Kime no Kata?','20, entre idori e tachiai.','x']]},
{k:'護',t:'Kodokan Goshin Jutsu',c:[{t:'Defesa pessoal em 21 técnicas',x:`<b>Toshi no bu</b> (desarmado, 12): ryote-dori, hidari-eri-dori, migi-eri-dori, kataude-dori, ushiro-eri-dori, ushiro-jime, kakae-dori, naname-uchi, ago-tsuki, gammen-tsuki, mae-geri, yoko-geri.<br><b>Buki no bu</b> (armado, 9): tsukkake, choku-zuki, naname-zuki, furiage, furioroshi, morote-zuki, shomen-zuki, koshi-gamae, haimen-zuki.`},{t:'Ensinar e pesquisar',x:`No 5º dan a CBJ pede experiência de ensino e cursos pedagógicos, como participante ou ministrante, além de 18 anos de prática contados desde o shodan.`}],qa:()=>[['Qual kata é o foco do 5º dan?','Kodokan Goshin Jutsu.','k'],['Quantas técnicas tem o Kodokan Goshin Jutsu?','21.','x']]},

S.sj.ch=S.sj.ch||{};let CV=null,CQ=null;
const chOpen=i=>i<=Math.min(S.lv,CHP.length-1);
function kGo(i){if(!chOpen(i))return;CV={i,c:0,m:'lic'};render();scrollTo(0,0)}
function kc(d){CV.c=Math.max(0,Math.min(CHP[CV.i].c.length-1,CV.c+d));render();scrollTo(0,0)}
function kx(){CV=null;CQ=null;render();scrollTo(0,0)}
function kd(){const i=CV.i,own=shuf(CHP[i].qa()).slice(0,5).map(x=>({x})),glob=CHP.slice(0,i+1).flatMap(p=>p.qa()),near=CHP[i].qa(),rv=i>0?shuf(CHP.slice(0,i).flatMap(p=>p.qa())).slice(0,3).map(x=>({x,r:1})):[];
 const l=[...own,...rv].map(it=>{const [q,a,k]=it.x,u=(arr,s)=>[...new Set(arr.filter(y=>(s?y[2]===k:true)&&y[1]!==a).map(y=>y[1]))],nr=shuf(u(near,1)),fr=shuf(u(glob,1)).filter(z=>!nr.includes(z)),an=shuf(u(glob,0)).filter(z=>!nr.includes(z)&&!fr.includes(z));return{q,a,r:it.r,o:shuf([a,...[...nr,...fr,...an].slice(0,3)])}});
 CQ={l,i:0,pick:null,own:0,rev:0};CV.m='des';render();scrollTo(0,0)}
function ka(k){const q=CQ.l[CQ.i];if(CQ.pick!==null)return;CQ.pick=k;if(q.o[k]===q.a){if(q.r)CQ.rev++;else CQ.own++}render()}
function kn(){CQ.i++;CQ.pick=null;if(CQ.i>=CQ.l.length){const ot=CQ.l.filter(q=>!q.r).length,rt=CQ.l.length-ot,pts=CQ.own*10+CQ.rev*5,r=(CQ.own+CQ.rev)/CQ.l.length,st=r===1?3:r>=.85?2:r>=.6?1:0,old=S.sj.ch[CV.i]||{st:0,b:0};S.sj.ch[CV.i]={st:Math.max(old.st,st),b:Math.max(old.b,pts)};save();CV.m='res';CV.res={st,gain:Math.max(0,pts-old.b),ok:CQ.own+CQ.rev,tot:CQ.l.length,rt,rc:CQ.rev}}render();scrollTo(0,0)}
function sab(){
 if(CV){const p=CHP[CV.i],bn=B[CV.i],hd=`<div class="row" style="margin-bottom:18px"><button class="lnk" onclick="kx()">‹ Capítulos</button><span class="eb" style="margin:0">${bn[0]} · ${bn[1]}</span></div>`;
  if(CV.m==='lic'){const c=p.c[CV.c],last=CV.c===p.c.length-1;return hd+`<div class="row" style="justify-content:flex-start;gap:16px;margin-bottom:6px"><span class="hk">${p.k}</span><h1 style="margin:0">${p.t}</h1></div><p class="sub">Lição ${CV.c+1} de ${p.c.length}</p>${c.s?`<div class="scn">${SC[c.s]}</div>`:''}${c.p?`<div class="scn"><img src="${KANO}" alt="Jigoro Kano" style="width:100%;display:block;filter:grayscale(1)"><p class="sub" style="margin:6px 0 0">${c.cap}</p></div>`:''}<h2 style="margin-top:22px">${c.t}</h2><p style="margin:0 0 6px">${c.x}</p><div style="text-align:center;margin:26px 0 14px">${p.c.map((_,k)=>`<i class="dt ${k===CV.c?'on':''}"></i>`).join('')}</div><div class="row" style="gap:12px"><button class="lnk" ${CV.c===0?'disabled':''} onclick="kc(-1)">‹ Voltar</button>${last?`<button class="btn" style="flex:1" onclick="kd()">Fazer o desafio</button>`:`<button class="btn" style="flex:1" onclick="kc(1)">Continuar ›</button>`}</div>`}
  if(CV.m==='des'){const q=CQ.l[CQ.i],pk=CQ.pick!==null,ok=pk&&q.o[CQ.pick]===q.a;return hd+`<p class="eb">${q.r?'Revisão cumulativa':'Desafio'} · ${CQ.i+1} de ${CQ.l.length}</p><div class="q">${q.q}</div>`+q.o.map((o,k)=>`<button class="opt ${pk?(o===q.a?'ok':k===CQ.pick?'no':''):''}" ${pk?'disabled':''} onclick="ka(${k})">${o}</button>`).join('')+(pk?`<p class="sub" style="margin:14px 0 0">${ok?'Certo.':'A resposta certa é: '+q.a}</p><button class="btn" style="margin-top:12px" onclick="kn()">${CQ.i+1<CQ.l.length?'Continuar':'Ver resultado'}</button>`:'')+`<button class="lnk" style="margin-top:18px" onclick="CV.m='lic';CQ=null;render()">Sair do desafio</button>`}
  const r=CV.res,nx=CV.i+1<CHP.length&&chOpen(CV.i+1);return hd+`<div style="text-align:center;padding:20px 0"><span class="hk" style="${r.st?'':'background:#8b9099'}">${p.k}</span><div class="big stars" style="margin-top:14px">${stars(r.st)}</div><p style="margin:10px 0 2px"><b>${r.ok} de ${r.tot} certas</b>${r.rt?` (${r.rc} de ${r.rt} na revisão)`:''}</p><p class="sub">${r.st?`+${r.gain} XP. ${nx?'O próximo capítulo está liberado.':'Os próximos capítulos abrem quando você avançar de faixa.'}`:'Releia a lição e tente de novo: é preciso acertar 60% para ganhar o selo.'}</p></div>`+(r.st&&nx?`<button class="btn" onclick="kGo(${CV.i+1})">Próximo capítulo ›</button>`:'')+`<button class="lnk" style="margin-top:14px" onclick="CV.m='lic';CV.c=0;CQ=null;render()">Rever a lição</button> <button class="lnk" onclick="kd()">Repetir o desafio</button>`}
 const ch=Object.values(S.sj.ch),x=ch.reduce((a,b)=>a+b.b,0),sl=ch.filter(c=>c.st>0).length,lim=Math.min(S.lv,CHP.length-1)+1;
 let h=`<p class="eb">Gaku · 学 · estudar</p><h1>O que um judoca precisa saber</h1><p class="sub">Cada faixa abre novos capítulos. Quem é faixa branca sabe menos do Japão e do judô do que quem é marrom, e o desafio de cada capítulo traz perguntas de revisão dos anteriores.</p><div class="row" style="align-items:flex-end;margin:22px 0 6px"><div><div class="eb" style="margin:0">XP</div><div class="big">${x}</div></div><div style="text-align:right"><div class="eb" style="margin:0">Selos</div><div class="big">${sl}<small> / ${lim}</small></div></div></div><div class="obi" style="--b1:var(--acc);--b2:var(--acc)"><i style="width:${100*sl/lim}%"></i></div>`;
 GR.forEach((g,gi)=>{h+=`<h2>${g.n} · ${g.s}</h2>`;CHP.forEach((c,i)=>{if(i<g.r[0]||i>g.r[1])return;const op=chOpen(i),r=S.sj.ch[i]||{st:0};h+=`<button class="rowc ${op?'':'lk2'}" onclick="kGo(${i})"><span class="kj">${op?c.k:'·'}</span><span class="tx"><small>${B[i][0]} · ${B[i][1]}</small><b>${c.t}</b></span><span class="stars">${op?stars(r.st):'bloqueado'}</span></button>`})});
 return h+`<h2>Biblioteca</h2>`+D('v','Vocabulário ('+CARDS.length+' termos)',[...CARDS].sort((a,b)=>a[0].localeCompare(b[0])).map(c=>`<p style="margin:6px 0"><b>${c[0]}</b> · ${c[1]}</p>`).join(''))+D('m','Minha lista para o exame',mine())}
const TABS2=[['ini','道','Michi'],['cal','稽古','Keiko'],['est','技','Waza'],['sab','学','Gaku'],['rel','記録','Kiroku']];
function nav(){document.getElementById('nav').innerHTML=TABS2.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><span class="kn">${t[1]}</span>${t[2]}</button>`).join('')}

render();
</script>
